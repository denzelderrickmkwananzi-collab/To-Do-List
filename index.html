<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Today Task Dashboard</title>
  <link rel="preconnect" href="https://googleapis.com" />
  <link rel="preconnect" href="https://gstatic.com" crossorigin />
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="dashboard">
    
    <section class="card greeting-card">
      <div class="greeting-left">
        <h1>Welcome User</h1>
        <p class="subtitle">What do you plan to do today?</p>
      </div>
      <div class="greeting-right">
        <div class="studio-meta">
          <span class="studio-name">DnzlDrrck Studios</span>
          <span class="member-badge">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
              <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
            </svg>
            1.354
          </span>
        </div>
      </div>
    </section>

    <section class="card profile-card">
      <div class="profile-left">
        <div class="panda-wrapper">
          <div class="panda-avatar">TK</div>
          <span class="info-dot" title="Profile verified">i</span>
        </div>
        <div class="profile-info">
          <h2>My Taska</h2>
          <p class="company-name">DerriSoft</p>
        </div>
      </div>

      <div class="divider"></div>

      <div class="profile-stats">
        <div class="stat-row">
          <span class="stat-label">Overall Score :</span>
          <span class="stat-value" id="impact-score">-</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Session Length :</span>
          <span class="stat-value" id="session-length">-</span>
        </div>
      </div>
    </section>

    <section class="card task-card">
      <div class="task-header">
        <h2>Today's Tasks</h2>
        <div class="header-actions">
          <button type="button" class="btn btn-outline" id="focus-mode-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="13" r="8"></circle>
              <path d="M12 9v4l2 2"></path>
              <path d="M9 2h6"></path>
            </svg>
            <span>Focus Mode</span>
          </button>
          <button type="button" class="btn btn-dark" id="ai-assist-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/>
              <path d="M19 2L19.8 4.2L22 5L19.8 5.8L19 8L18.2 5.8L16 5L18.2 4.2L19 2Z"/>
            </svg>
            <span>AI Assist</span>
          </button>
        </div>
      </div>

      <form class="add-task-form hidden" id="add-task-form">
        <input type="text" id="new-task-input" placeholder="Enter task description..." required />
        <select id="new-task-priority" aria-label="Task priority">
          <option value="High">High</option>
          <option value="Medium" selected>Medium</option>
          <option value="Low">Low</option>
        </select>
        <button type="submit" class="btn btn-primary btn-sm">Save</button>
        <button type="button" class="btn btn-ghost btn-sm" id="cancel-add-btn">Cancel</button>
      </form>

      <ul class="task-list" id="task-list"></ul>

      <div class="task-footer">
        <button type="button" class="btn btn-primary" id="finish-btn">Finish</button>
        <button type="button" class="btn btn-soft" id="toggle-add-btn">+ Add Task</button>
        <span class="footer-info-icon" title="Add tasks, set priorities, and click Finish to calculate your session score.">i</span>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
